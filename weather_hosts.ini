# Inventory for the Canadian city weather pull.
#
# The job runs on the Jenkins server itself and reaches out to the internet,
# so the only host is this machine, over a local connection (no SSH).
#
#   ansible-playbook -i weather_hosts.ini weather_pull.yml

[weather_servers]
localhost ansible_connection=local

# To run it on a different box later, drop localhost and add the host here.
# It would then need SSH access plus python3, python3-venv and tzdata:
#
# weatherbox.internal ansible_user=jenkins
